name: Feature request
description: Suggest an improvement or capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What limitation or user need does this address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: This may affect security or privacy.
        - label: This may affect deployment or configuration.
        - label: This may affect existing recordings or stored data.
